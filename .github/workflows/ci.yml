name: ChurnGuard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile src/api/main.py
          python -m py_compile src/data/preprocessing.py
          python -m py_compile src/data/validation.py
          python -m py_compile src/monitoring/drift.py
          python -m py_compile src/training/train.py
          python -m py_compile src/training/retrain.py

      
      
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ --cov=src --cov-report=term-missing


      - name: Build Docker image
        run: |
          docker build -t churnguard-api .